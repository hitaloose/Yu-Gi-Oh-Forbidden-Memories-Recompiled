name: Sync with upstream

# Follows the upstream's stable releases (notes/switch.md, "Fork releases").
# When the upstream publishes a vX.Y.Z (its pre-releases, with a hyphen, are
# left alone) that this fork has no vX.Y.Z-switch.* tag for, the tag is merged
# into master, and vX.Y.Z-switch.1 is tagged and pushed: that push starts
# switch-release.yml, which drafts the release. A merge that conflicts is left
# undone and opens an issue instead.
#
# The pushes need the SYNC_TOKEN secret, a fine-grained token for this
# repository (Contents, Workflows, Actions and Issues: read and write): the
# workflow's own token can neither push a merge that touches
# .github/workflows/ nor start other workflows with its pushes.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream tag to merge (empty takes its latest stable release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: switch-sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: Unchiga/Yu-Gi-Oh-Forbidden-Memories-Recompiled

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Configure the SYNC_TOKEN repository secret (notes/switch.md, \"Fork releases\")."
            exit 1
          fi
      - name: Upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
        run: |
          # releases/latest is the newest release that is neither a draft
          # nor a pre-release.
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a stable vX.Y.Z release"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Already released here?
        id: done
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          existing="$(git tag --list "$UPSTREAM_TAG-switch.*" | head -1)"
          if [ -n "$existing" ]; then
            echo "::notice::$UPSTREAM_TAG is already released here as $existing; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge the upstream release
        id: merge
        if: steps.done.outputs.skip == 'false'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.md merge=ours (.gitattributes): the fork's README stays.
          git config merge.ours.driver true
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$UPSTREAM_TAG:refs/upstream/$UPSTREAM_TAG"
          ls .github/workflows > "$RUNNER_TEMP/workflows-before"
          if git merge --no-edit -m "Merge upstream $UPSTREAM_TAG" "refs/upstream/$UPSTREAM_TAG"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            ls .github/workflows | comm -13 "$RUNNER_TEMP/workflows-before" - | grep -v '^switch-' > "$RUNNER_TEMP/workflows-new" || true
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open an issue for the conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Sync with upstream $UPSTREAM_TAG needs a manual merge"
          {
            echo "Merging the upstream release [$UPSTREAM_TAG](https://github.com/$UPSTREAM/releases/tag/$UPSTREAM_TAG) into \`master\` conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts"
            echo
            echo "Merge it by hand (notes/switch.md, \"Fork releases\"), then push \`master\` and the tag \`$UPSTREAM_TAG-switch.1\`."
            echo
            echo "Run: $RUN_URL"
          } > issue.md
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "$title" --body-file issue.md
          fi
          echo "::error::$UPSTREAM_TAG conflicts with master; see the issue."
          exit 1
      - name: Push master and the release tag
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          tag="$UPSTREAM_TAG-switch.1"
          git push origin master
          # A workflow the upstream added runs here from now on: turned off
          # straight away, so only switch-*.yml runs on this fork.
          while read -r workflow; do
            [ -n "$workflow" ] || continue
            echo "::warning::The upstream added .github/workflows/$workflow; disabling it on this fork."
            gh workflow disable "$workflow" --repo "$GITHUB_REPOSITORY" || echo "::warning::could not disable $workflow"
          done < "$RUNNER_TEMP/workflows-new"
          git tag -a "$tag" -m "$tag: the Switch homebrew on upstream $UPSTREAM_TAG"
          git push origin "refs/tags/$tag"
          echo "::notice::Tagged $tag; switch-release.yml drafts the release."
